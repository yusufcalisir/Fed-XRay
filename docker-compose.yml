services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fed-xray-backend
    environment:
      - PORT=8000
      - FED_XRAY_DATA_DIR=/app/data
    ports:
      - "8000:8000"
    volumes:
      - fedxray-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: fed-xray-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fedxray-data:
    driver: local

