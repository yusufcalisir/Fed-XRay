services:
  - type: web
    name: fed-xray-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    # Single worker: Render free tier has 512 MB RAM.
    # --loop asyncio avoids uvloop SIGILL on virtualized hypervisors.
    # --timeout-keep-alive 75 keeps SSE connections alive past Render's 60s proxy timeout.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --loop asyncio --timeout-keep-alive 75 --no-access-log
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Disable PyTorch multi-threading to reduce peak RAM on free tier
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: DISABLE_HNSW
        value: "1"
