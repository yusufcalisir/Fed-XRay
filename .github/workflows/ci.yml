name: CI Test and Build Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: "1. Code Quality and Static Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linting Checks
        run: ruff check .

      - name: Verify Rule 13 (Prohibited Em Dashes)
        run: |
          python -c "
          import glob, sys
          prohibited = ['\u2014', '\u2013', '\u2015']
          targets = []
          for pat in ['api/**/*.py', 'src/**/*.py', 'tests/**/*.py']:
              targets.extend(glob.glob(pat, recursive=True))
          violations = []
          for path in targets:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  for i, line in enumerate(f, 1):
                      if any(p in line for p in prohibited):
                          violations.append(f'{path}:{i}: {line.strip()[:60]}')
          if violations:
              print(f'Detected {len(violations)} prohibited em dash violations:')
              for v in violations[:10]:
                  print('  ' + v)
              sys.exit(1)
          print('Clean: Zero em dashes detected in codebase.')
          "

  backend-tests:
    name: "2. Backend Pytest and Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run Backend Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --durations=10

  frontend-tests:
    name: "3. Frontend Unit and Component Tests (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        env:
          NODE_OPTIONS: "--require ./src/test/preload-zstd.cjs"
        run: npm test

  frontend-build:
    name: "4. Frontend Production Build Validation (Next.js)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Production Application
        working-directory: frontend
        run: npm run build

  docker-build:
    name: "5. Docker Container Build Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t fed-xray-backend:ci .

      - name: Build Frontend Docker Image
        run: |
          docker build -t fed-xray-frontend:ci frontend/

